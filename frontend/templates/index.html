<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .format-section {
            margin-bottom: 24px;
        }

        .format-section h3 {
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 12px;
        }

        .format-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .format-option {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .format-option:hover {
            border-color: #444;
        }

        .format-option.selected {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .format-option span {
            font-size: 12px;
            color: #888;
        }

        .format-option.selected span {
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            background: #2563eb;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-section {
            margin-top: 24px;
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .progress-header span {
            font-size: 13px;
            color: #888;
        }

        .progress-header .percent {
            color: #3b82f6;
            font-weight: 600;
        }

        .progress-bar {
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }

        .progress-status {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .results-section {
            margin-top: 24px;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 4px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #666;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #888;
        }

        .tab-btn.active {
            background: #1a1a1a;
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .result-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
        }

        .result-card h4 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #aaa;
        }

        .result-content {
            background: #111;
            border-radius: 6px;
            padding: 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .result-content pre {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 12px;
            color: #888;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .download-links {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #888;
            font-size: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: #222;
            color: #fff;
        }

        .error-message {
            margin-top: 16px;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-size: 13px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #444;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>OmniCast</h1>
            <p>Multi-format news distribution</p>
        </div>

        <div class="card">
            <form id="storyForm" onsubmit="submitStory(event)">
                <div class="form-group">
                    <label for="storyTitle">Story Title</label>
                    <input type="text" id="storyTitle" name="storyTitle" placeholder="Enter headline or working title" required>
                </div>

                <div class="form-group">
                    <label for="notes">Reporter Notes</label>
                    <textarea id="notes" name="notes" placeholder="Enter your story notes, facts, background info..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="interviewTranscript">Interview Transcript (optional)</label>
                    <textarea id="interviewTranscript" name="interviewTranscript" placeholder="Paste interview transcripts, quotes, or soundbites here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="brollDescription">B-Roll Description (optional)</label>
                    <textarea id="brollDescription" name="brollDescription" placeholder="Describe available footage: interviews, location shots, graphics..." style="min-height: 60px;"></textarea>
                </div>

                <div class="format-section">
                    <h3>Output Formats</h3>
                    <div class="format-options">
                        <div class="format-option selected" data-format="tv" onclick="toggleFormat(this)">
                            <span>TV</span>
                        </div>
                        <div class="format-option selected" data-format="web" onclick="toggleFormat(this)">
                            <span>Web</span>
                        </div>
                        <div class="format-option selected" data-format="social" onclick="toggleFormat(this)">
                            <span>Social</span>
                        </div>
                        <div class="format-option selected" data-format="youtube" onclick="toggleFormat(this)">
                            <span>YouTube</span>
                        </div>
                        <div class="format-option selected" data-format="podcast" onclick="toggleFormat(this)">
                            <span>Podcast</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Generate Content</button>
            </form>

            <div class="progress-section" id="progressSection">
                <div class="progress-header">
                    <span id="progressStatus">Processing...</span>
                    <span class="percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-status" id="progressDetail">Uploading files...</div>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="results-section" id="resultsSection">
            <div class="card">
                <div class="results-tabs" id="resultsTabs"></div>
                <div id="resultsContent"></div>
            </div>
        </div>

        <div class="footer">
            Powered by OpenAI
        </div>
    </div>

    <script>
        let currentJobId = null;

        function toggleFormat(el) {
            el.classList.toggle('selected');
        }

        function getSelectedFormats() {
            const formats = [];
            document.querySelectorAll('.format-option.selected').forEach(el => {
                formats.push(el.dataset.format);
            });
            return formats;
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 5000);
        }

        async function submitStory(e) {
            e.preventDefault();

            const notes = document.getElementById('notes').value.trim();
            const storyTitle = document.getElementById('storyTitle').value.trim();
            const interviewTranscript = document.getElementById('interviewTranscript').value.trim();
            const brollDescription = document.getElementById('brollDescription').value.trim();
            const formats = getSelectedFormats();

            if (!notes || !storyTitle) {
                showError('Please enter a title and notes');
                return;
            }

            if (formats.length === 0) {
                showError('Please select at least one output format');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';

            const progressSection = document.getElementById('progressSection');
            progressSection.classList.add('active');
            updateProgress(10, 'Starting content generation...');

            try {
                // Build full notes with all context
                let fullNotes = `Title: ${storyTitle}\n\n${notes}`;
                if (interviewTranscript) {
                    fullNotes += `\n\nINTERVIEW TRANSCRIPT:\n${interviewTranscript}`;
                }
                if (brollDescription) {
                    fullNotes += `\n\nB-ROLL/VISUALS AVAILABLE:\n${brollDescription}`;
                }

                const formData = new FormData();
                formData.append('notes', fullNotes);
                formData.append('output_formats', formats.join(','));

                const response = await fetch('/api/process', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    let errorMsg = 'Processing failed';
                    try {
                        const error = await response.json();
                        errorMsg = error.detail || error.error || errorMsg;
                    } catch {
                        const text = await response.text();
                        errorMsg = text || `Processing failed (${response.status})`;
                    }
                    throw new Error(errorMsg);
                }

                const result = await response.json();
                currentJobId = result.job_id;

                // Check if job completed synchronously (Vercel serverless)
                if (result.status === 'completed') {
                    // Fetch final job data
                    const jobResponse = await fetch(`/api/job/${currentJobId}`);
                    if (jobResponse.ok) {
                        const job = await jobResponse.json();
                        displayResults(job);
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').textContent = 'Generate Content';
                    }
                } else {
                    // Start polling for status (local development)
                    pollJobStatus();
                }

            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Content';
                progressSection.classList.remove('active');
            }
        }

        function updateProgress(percent, status) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            if (status) {
                document.getElementById('progressDetail').textContent = status;
            }
        }

        async function pollJobStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/job/${currentJobId}`);

                if (!response.ok) {
                    let errorMsg = 'Failed to check status';
                    try {
                        const error = await response.json();
                        errorMsg = error.detail || error.error || errorMsg;
                    } catch {
                        errorMsg = `Status check failed (${response.status})`;
                    }
                    throw new Error(errorMsg);
                }

                const job = await response.json();

                updateProgress(job.progress, job.status);

                if (job.status === 'completed') {
                    displayResults(job);
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = 'Generate Content';
                } else if (job.status === 'failed') {
                    showError(job.errors.join(', ') || 'Processing failed');
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = 'Generate Content';
                    document.getElementById('progressSection').classList.remove('active');
                } else {
                    // Keep polling
                    setTimeout(pollJobStatus, 1500);
                }
            } catch (error) {
                showError(error.message || 'Failed to check status');
                setTimeout(pollJobStatus, 3000);
            }
        }

        function displayResults(job) {
            const resultsSection = document.getElementById('resultsSection');
            const tabsContainer = document.getElementById('resultsTabs');
            const contentContainer = document.getElementById('resultsContent');

            tabsContainer.innerHTML = '';
            contentContainer.innerHTML = '';

            const formatNames = {
                tv: 'TV',
                web: 'Web',
                social: 'Social',
                youtube: 'YouTube',
                podcast: 'Podcast'
            };

            const outputs = job.outputs || {};
            const formatKeys = Object.keys(outputs);

            formatKeys.forEach((format, index) => {
                const output = outputs[format];
                const isActive = index === 0;

                // Create tab button
                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab-btn' + (isActive ? ' active' : '');
                tabBtn.textContent = formatNames[format] || format;
                tabBtn.onclick = () => switchTab(format);
                tabsContainer.appendChild(tabBtn);

                // Create content
                const contentDiv = document.createElement('div');
                contentDiv.className = 'tab-content' + (isActive ? ' active' : '');
                contentDiv.id = 'tab-' + format;

                let contentHtml = '';
                const content = output.content || output.script || {};

                if (format === 'tv') {
                    contentHtml = `
                        <div class="result-card">
                            <h4>TV Broadcast Script</h4>
                            <div class="result-content">
                                <pre>${escapeHtml(content.full_script || JSON.stringify(content, null, 2))}</pre>
                            </div>
                            ${renderDownloadLinks(output.files)}
                        </div>
                    `;
                } else if (format === 'web') {
                    contentHtml = `
                        <div class="result-card">
                            <h4>Web Article</h4>
                            <div class="result-content">
                                <pre><strong>${escapeHtml(content.headline || '')}</strong>\n\n${escapeHtml(content.lead || '')}\n\n${escapeHtml(content.body_html || content.full_article_html || '')}</pre>
                            </div>
                            ${renderDownloadLinks(output.files)}
                        </div>
                    `;
                } else if (format === 'social') {
                    contentHtml = `
                        <div class="result-card">
                            <h4>Social Media Content</h4>
                            <div class="result-content">
                                <pre><strong>Headline:</strong> ${escapeHtml(content.headline_overlay || '')}\n\n<strong>Hook:</strong> ${escapeHtml(content.hook_text || '')}\n\n<strong>Caption:</strong>\n${escapeHtml(content.caption || '')}\n\n<strong>Hashtags:</strong> ${(content.hashtags || []).join(' ')}\n\n<strong>Video Script:</strong>\n${escapeHtml(content.video_script || '')}</pre>
                            </div>
                            ${renderDownloadLinks(output.files)}
                        </div>
                    `;
                } else if (format === 'youtube') {
                    contentHtml = `
                        <div class="result-card">
                            <h4>YouTube Content</h4>
                            <div class="result-content">
                                <pre><strong>Title:</strong> ${escapeHtml(content.title || '')}\n\n<strong>Description:</strong>\n${escapeHtml(content.description || '')}\n\n<strong>Tags:</strong> ${(content.tags || []).join(', ')}\n\n<strong>Full Script:</strong>\n${escapeHtml(content.full_script || '')}</pre>
                            </div>
                            ${renderDownloadLinks(output.files)}
                        </div>
                    `;
                } else if (format === 'podcast') {
                    contentHtml = `
                        <div class="result-card">
                            <h4>Podcast Episode</h4>
                            <div class="result-content">
                                <pre><strong>Episode Title:</strong> ${escapeHtml(content.episode_title || '')}\n\n<strong>Description:</strong>\n${escapeHtml(content.episode_description || '')}\n\n<strong>Script:</strong>\n${escapeHtml(content.full_script || '')}\n\n<strong>Show Notes:</strong>\n${escapeHtml(content.show_notes || '')}</pre>
                            </div>
                            ${renderDownloadLinks(output.files)}
                        </div>
                    `;
                }

                contentDiv.innerHTML = contentHtml;
                contentContainer.appendChild(contentDiv);
            });

            resultsSection.classList.add('active');
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        function renderDownloadLinks(files) {
            if (!files) return '';

            const links = Object.entries(files).map(([type, path]) => {
                const fileName = path.split('/').pop();
                return `<a href="${path}" download class="download-btn">${type.toUpperCase()}</a>`;
            }).join('');

            return `<div class="download-links">${links}</div>`;
        }

        function switchTab(format) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById('tab-' + format).classList.add('active');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
