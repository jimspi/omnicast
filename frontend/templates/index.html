<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniCast - Multi-Format Content Production</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .api-key-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
        }

        .api-key-section label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #2d3748;
        }

        .api-key-section input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .api-key-section small {
            display: block;
            margin-top: 0.5rem;
            color: #718096;
        }

        .input-section {
            margin-bottom: 2rem;
        }

        .input-section h2 {
            font-size: 1.5rem;
            color: #2d3748;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #667eea;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            font-family: inherit;
        }

        .generate-button {
            width: 100%;
            padding: 1.25rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 2rem;
        }

        .generate-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            margin-top: 3rem;
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .results-section h2 {
            font-size: 1.8rem;
            color: #2d3748;
            margin-bottom: 2rem;
            text-align: center;
        }

        .format-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .format-tab {
            padding: 0.75rem 1.5rem;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .format-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .format-content {
            display: none;
            background: #f7fafc;
            padding: 2rem;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
        }

        .format-content.active {
            display: block;
        }

        .format-content h3 {
            color: #2d3748;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .content-block {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid #667eea;
        }

        .content-block h4 {
            color: #4a5568;
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .content-block p,
        .content-block ul {
            color: #718096;
            line-height: 1.6;
        }

        .content-block ul {
            padding-left: 1.5rem;
        }

        .content-block li {
            margin-bottom: 0.5rem;
        }

        .copy-button {
            padding: 0.5rem 1rem;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            transition: background 0.3s;
        }

        .copy-button:hover {
            background: #38a169;
        }

        .script-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            background: #2d3748;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .format-icon {
            display: inline-block;
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .main-card {
                padding: 1.5rem;
            }

            .format-tabs {
                gap: 0.5rem;
            }

            .format-tab {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>OmniCast</h1>
            <p>Transform your journalism into multi-format content instantly</p>
        </div>

        <div class="main-card">
            <div class="api-key-section">
                <label for="apiKey">OpenAI API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
                <small>Your API key is stored locally and never sent anywhere except OpenAI</small>
            </div>

            <div class="input-section">
                <h2>Story Materials</h2>

                <div class="form-group">
                    <label for="storyTitle">Story Title / Working Headline</label>
                    <input type="text" id="storyTitle" placeholder="Enter your story title">
                </div>

                <div class="form-group">
                    <label for="storyNotes">Reporter Notes & Research</label>
                    <textarea id="storyNotes" placeholder="Paste your notes, research findings, key facts, quotes, and background information..."></textarea>
                </div>

                <div class="form-group">
                    <label for="interviewTranscript">Interview Transcript</label>
                    <textarea id="interviewTranscript" placeholder="Paste interview transcripts here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="brollDescription">B-Roll & Visual Assets Description</label>
                    <textarea id="brollDescription" placeholder="Describe available b-roll footage, images, graphics, and visual elements..."></textarea>
                </div>

                <div class="form-group">
                    <label for="targetAudience">Target Audience & Tone</label>
                    <input type="text" id="targetAudience" placeholder="e.g., General public, tech-savvy millennials, local community">
                </div>

                <div class="form-group">
                    <label for="storyAngle">Story Angle / Focus</label>
                    <input type="text" id="storyAngle" placeholder="e.g., Human interest, investigative, breaking news, feature">
                </div>
            </div>

            <button class="generate-button" onclick="generateContent()">
                Generate Multi-Format Content
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Generating content across all formats... This may take a minute.</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="results-section" id="resultsSection">
            <h2>Your Multi-Format Story Package</h2>

            <div class="format-tabs">
                <button class="format-tab active" onclick="switchFormat('tv')">
                    <span class="format-icon">📺</span> TV Broadcast
                </button>
                <button class="format-tab" onclick="switchFormat('web')">
                    <span class="format-icon">🌐</span> Web Article
                </button>
                <button class="format-tab" onclick="switchFormat('social')">
                    <span class="format-icon">📱</span> Social Media
                </button>
                <button class="format-tab" onclick="switchFormat('youtube')">
                    <span class="format-icon">▶️</span> YouTube
                </button>
                <button class="format-tab" onclick="switchFormat('podcast')">
                    <span class="format-icon">🎙️</span> Podcast
                </button>
            </div>

            <div id="tv" class="format-content active"></div>
            <div id="web" class="format-content"></div>
            <div id="social" class="format-content"></div>
            <div id="youtube" class="format-content"></div>
            <div id="podcast" class="format-content"></div>
        </div>
    </div>

    <script>
        let generatedContent = {};

        function switchFormat(format) {
            document.querySelectorAll('.format-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.format-content').forEach(content => content.classList.remove('active'));

            event.target.closest('.format-tab').classList.add('active');
            document.getElementById(format).classList.add('active');
        }

        async function generateContent() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const storyTitle = document.getElementById('storyTitle').value.trim();
            const storyNotes = document.getElementById('storyNotes').value.trim();
            const interviewTranscript = document.getElementById('interviewTranscript').value.trim();
            const brollDescription = document.getElementById('brollDescription').value.trim();
            const targetAudience = document.getElementById('targetAudience').value.trim();
            const storyAngle = document.getElementById('storyAngle').value.trim();

            if (!apiKey) {
                showError('Please enter your OpenAI API key');
                return;
            }

            if (!storyTitle || !storyNotes) {
                showError('Please provide at least a story title and reporter notes');
                return;
            }

            document.querySelector('.generate-button').disabled = true;
            document.getElementById('loading').classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');

            try {
                const formats = [
                    { id: 'tv', name: 'TV Broadcast' },
                    { id: 'web', name: 'Web Article' },
                    { id: 'social', name: 'Social Media' },
                    { id: 'youtube', name: 'YouTube' },
                    { id: 'podcast', name: 'Podcast' }
                ];

                for (const format of formats) {
                    generatedContent[format.id] = await generateFormatContent(
                        apiKey,
                        format.id,
                        storyTitle,
                        storyNotes,
                        interviewTranscript,
                        brollDescription,
                        targetAudience,
                        storyAngle
                    );
                }

                renderResults();
                document.getElementById('resultsSection').classList.add('active');
                document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showError(`Error generating content: ${error.message}`);
            } finally {
                document.querySelector('.generate-button').disabled = false;
                document.getElementById('loading').classList.remove('active');
            }
        }

        async function generateFormatContent(apiKey, format, title, notes, transcript, broll, audience, angle) {
            const prompts = {
                tv: `You are an experienced TV news producer. Create a complete TV broadcast package for this story:

STORY TITLE: ${title}
REPORTER NOTES: ${notes}
INTERVIEW TRANSCRIPT: ${transcript || 'None provided'}
B-ROLL AVAILABLE: ${broll || 'None specified'}
TARGET AUDIENCE: ${audience || 'General public'}
STORY ANGLE: ${angle || 'Straight news'}

Generate a comprehensive TV broadcast package including:
1. ANCHOR INTRO (15-20 seconds) - What the anchor reads to introduce the story
2. FULL SCRIPT with timecodes - Complete reporter narration with timestamps for video/audio cues
3. SOUNDBITES - Exact quotes to use with in/out times
4. B-ROLL SHOT LIST - Specific visuals needed with timing
5. SUGGESTED RUNTIME - Total package length
6. GRAPHICS/CHYRONS - Lower thirds and on-screen text needed

Format with clear sections and be specific about timing.`,

                web: `You are an experienced digital editor. Create a compelling web article from this story:

STORY TITLE: ${title}
REPORTER NOTES: ${notes}
INTERVIEW TRANSCRIPT: ${transcript || 'None provided'}
VISUALS AVAILABLE: ${broll || 'None specified'}
TARGET AUDIENCE: ${audience || 'General public'}
STORY ANGLE: ${angle || 'Straight news'}

Generate a complete web article package including:
1. SEO-OPTIMIZED HEADLINE (60 chars max)
2. SUBHEADLINE (150 chars max)
3. LEAD PARAGRAPH - Compelling first 2-3 sentences
4. FULL ARTICLE - Well-structured with subheadings, 600-800 words
5. PULL QUOTES - 2-3 quotable excerpts to highlight
6. SOCIAL MEDIA EXCERPT - Shareable 1-2 sentence summary
7. IMAGE CAPTIONS - Suggested captions for 3-4 photos
8. RELATED LINKS - Suggested internal/external links
9. META DESCRIPTION - 155 characters for SEO

Write in AP style with clear structure.`,

                social: `You are a social media strategist for news organizations. Create engaging social media content from this story:

STORY TITLE: ${title}
REPORTER NOTES: ${notes}
INTERVIEW TRANSCRIPT: ${transcript || 'None provided'}
VISUALS AVAILABLE: ${broll || 'None specified'}
TARGET AUDIENCE: ${audience || 'General public'}
STORY ANGLE: ${angle || 'Straight news'}

Generate a complete social media package including:
1. INSTAGRAM/TIKTOK VIDEO SCRIPT (30-60 seconds) - Hook + story + CTA
2. INSTAGRAM CAPTION - Engaging caption with hashtags
3. FACEBOOK POST - Longer format with context
4. TWITTER/X THREAD - 3-5 tweet thread telling the story
5. LINKEDIN POST - Professional angle for business audience
6. VIDEO HEADLINE TEXT - Text overlay for the video
7. SUBTITLE SCRIPT - Word-for-word captions for video
8. THUMBNAIL SUGGESTIONS - What should be in the thumbnail image
9. HASHTAG STRATEGY - Platform-specific hashtags

Make it engaging and platform-optimized.`,

                youtube: `You are a YouTube content strategist. Create a YouTube video package from this story:

STORY TITLE: ${title}
REPORTER NOTES: ${notes}
INTERVIEW TRANSCRIPT: ${transcript || 'None provided'}
VISUALS AVAILABLE: ${broll || 'None specified'}
TARGET AUDIENCE: ${audience || 'General public'}
STORY ANGLE: ${angle || 'Straight news'}

Generate a complete YouTube package including:
1. VIDEO TITLE - Attention-grabbing, SEO-optimized (under 70 chars)
2. THUMBNAIL TEXT - 3-5 words for thumbnail
3. VIDEO HOOK (first 15 seconds) - Script to grab attention immediately
4. FULL VIDEO SCRIPT - Chapter-by-chapter structure with timestamps
5. DESCRIPTION - First 150 chars + full description with timestamps
6. CHAPTER MARKERS - Timestamp + title for each section
7. TAGS - 15-20 relevant tags
8. END SCREEN SUGGESTIONS - What to promote at the end
9. PINNED COMMENT - Engaging first comment to pin
10. COMMUNITY POST - Post to tease the video

Optimize for YouTube algorithm and viewer retention.`,

                podcast: `You are a podcast producer. Create an engaging podcast episode from this story:

STORY TITLE: ${title}
REPORTER NOTES: ${notes}
INTERVIEW TRANSCRIPT: ${transcript || 'None provided'}
AUDIO ELEMENTS: ${broll || 'None specified'}
TARGET AUDIENCE: ${audience || 'General public'}
STORY ANGLE: ${angle || 'Straight news'}

Generate a complete podcast package including:
1. EPISODE TITLE - Compelling and descriptive
2. EPISODE DESCRIPTION - 2-3 paragraphs for podcast apps
3. COLD OPEN (30 seconds) - Attention-grabbing teaser
4. FULL SCRIPT with chapter markers - Conversational narration with timestamps
5. INTERVIEW CLIPS TO USE - Specific soundbites with context
6. SOUND DESIGN NOTES - Music/sfx cues and ambient audio
7. CHAPTER TITLES - For podcast players that support chapters
8. SHOW NOTES - Detailed notes with links and resources
9. SOCIAL MEDIA AUDIOGRAM SCRIPT - 60-second highlight clip
10. EMAIL NEWSLETTER COPY - Text to promote the episode

Write in a conversational, storytelling style perfect for audio.`
            };

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o',
                    messages: [{
                        role: 'user',
                        content: prompts[format]
                    }],
                    max_tokens: 4000,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error?.message || 'API request failed');
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        function renderResults() {
            const formats = {
                tv: { title: 'TV Broadcast Package', icon: '📺' },
                web: { title: 'Web Article Package', icon: '🌐' },
                social: { title: 'Social Media Package', icon: '📱' },
                youtube: { title: 'YouTube Video Package', icon: '▶️' },
                podcast: { title: 'Podcast Episode Package', icon: '🎙️' }
            };

            Object.keys(formats).forEach(formatId => {
                const content = generatedContent[formatId];
                const container = document.getElementById(formatId);
                const formatInfo = formats[formatId];

                container.innerHTML = `
                    <h3>${formatInfo.icon} ${formatInfo.title}</h3>
                    <div class="content-block">
                        <div class="script-content">${escapeHtml(content)}</div>
                        <button class="copy-button" onclick="copyToClipboard('${formatId}')">
                            Copy All Content
                        </button>
                    </div>
                `;
            });
        }

        function copyToClipboard(formatId) {
            const content = generatedContent[formatId];
            navigator.clipboard.writeText(content).then(() => {
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.background = '#38a169';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#48bb78';
                }, 2000);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => {
                errorDiv.classList.remove('active');
            }, 5000);
        }
    </script>
</body>
</html>
